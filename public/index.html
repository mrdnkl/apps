<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Proxy Dashboard</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card {
            background: #1e293b;
            padding: 2rem;
            border-radius: 1rem;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }
        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #38bdf8;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            background: #334155;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            width: fit-content;
            font-size: 0.875rem;
        }
        .dot {
            width: 8px;
            height: 8px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }
        .input-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
            color: #94a3b8;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 0.5rem;
            color: white;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .section-title {
            font-size: 0.875rem;
            color: #94a3b8;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            margin-bottom: 0.75rem;
        }
        a {
            display: block;
            background: #334155;
            color: #38bdf8;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
            word-break: break-all;
            font-size: 0.9rem;
            font-family: monospace;
        }
        a:hover {
            background: #475569;
            color: #7dd3fc;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>IPTV Proxy Dashboard</h1>
        <div class="status-badge">
            <div class="dot"></div>
            <span>Status: Online & Protected</span>
        </div>
        
        <div class="input-group">
            <label for="apiKey">API Key (Dynamically appends to links below):</label>
            <input type="text" id="apiKey" placeholder="Enter your API_KEY here..." oninput="updateLinks()">
        </div>

        <div class="section-title">Available Playlist Endpoints</div>
        <ul>
            <li><a class="playlist-link" href="/playlist.m3u" data-path="/playlist.m3u">/playlist.m3u (All Providers)</a></li>
            <li><a class="playlist-link" href="/playlist_p1.m3u" data-path="/playlist_p1.m3u">/playlist_p1.m3u (Provider 1)</a></li>
            <li><a class="playlist-link" href="/playlist_p2.m3u" data-path="/playlist_p2.m3u">/playlist_p2.m3u (Provider 2)</a></li>
            <li><a class="playlist-link" href="/playlist_p3.m3u" data-path="/playlist_p3.m3u">/playlist_p3.m3u (Provider 3)</a></li>
        </ul>
    </div>

    <script>
        function updateLinks() {
            const key = document.getElementById('apiKey').value.trim();
            const links = document.querySelectorAll('.playlist-link');
            
            links.forEach(link => {
                const path = link.getAttribute('data-path');
                if (key) {
                    link.href = `${path}?key=${encodeURIComponent(key)}`;
                    link.textContent = `${link.href}`;
                } else {
                    link.href = path;
                    link.textContent = path;
                }
            });
        }
    </script>
</body>
</html>
